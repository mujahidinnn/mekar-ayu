<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta id="theme-color-meta" name="theme-color" content="#FB7185" />
    <meta name="description" content="Mekar Ayu — pelacak siklus menstruasi privat, 100% tersimpan di perangkat Anda. Tanpa akun, tanpa server, tanpa pelacakan." />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('mekarayu-theme');
          var isDark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-color-meta')?.setAttribute('content', '#1c1917');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mekar Ayu" />
    <title>Mekar Ayu — Pelacak Siklus Privat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
