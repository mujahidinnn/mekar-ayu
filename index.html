    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Mekar Ayu",
        "url": "https://mekar-ayu.vercel.app/",
        "description": "Pelacak siklus menstruasi privat, 100% tersimpan di perangkat Anda. Tanpa akun, tanpa server, tanpa pelacakan.",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Any (Progressive Web App)",
        "inLanguage": "id",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('mekarayu-theme');
          var isDark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-color-meta')?.setAttribute('content', '#1c1917');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mekar Ayu" />
    <title>Mekar Ayu — Pelacak Siklus Privat</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #fb7185;
        transition: opacity 0.4s ease;
      }
      #splash svg {
        width: 72px;
        height: 72px;
        animation: splash-breathe 1.8s ease-in-out infinite;
      }
      #splash span {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #ffffff;
        opacity: 0.92;
      }
      @keyframes splash-breathe {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.08);
          opacity: 0.85;
        }
      }
      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">

    </div>

    <script type="module" src="/src/main.tsx"></script>
